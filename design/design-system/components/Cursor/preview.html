<!-- @dsCard group="Signature moments" height=420 width=960 subtitle="Yellow ball: lagging follow, fading trail, toss and bounce on click. Move fast, click, hover." -->
<!doctype html>
<html data-theme="light"><head><meta charset="utf-8">
<style>
 body{margin:0;height:420px;position:relative;overflow:hidden;cursor:none}*{cursor:none}
 .rows{position:absolute;left:32px;right:32px;top:28px;margin:0;padding:0;list-style:none}
 .rows li{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-top:1px solid var(--hairline);font:700 52px/1 var(--font-display);font-stretch:125%;letter-spacing:-.03em;text-transform:uppercase}
 .rows li span{font:500 11px var(--font-mono);letter-spacing:1px;color:var(--ink-muted)}
 .lnk{position:absolute;left:32px;bottom:30px}
 .gh,#b{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--yellow);pointer-events:none;will-change:transform}
 #lab{position:absolute;left:0;top:0;pointer-events:none;font:600 11px/1 var(--font-mono);letter-spacing:1px;text-transform:uppercase;color:#14130f;opacity:0;transition:opacity .25s}
</style></head>
<body>
<ul class="rows"><li data-c="view">Filozo <span>HOVER: VIEW</span></li><li data-c="view">Borderless <span>HOVER: VIEW</span></li></ul>
<button class="jc-link lnk" data-c="link">Say hello →</button>
<i id="b"></i><span id="lab">View</span>
<script>
(function(){
 var b=document.getElementById('b'),lab=document.getElementById('lab'),pool=[];
 for(var i=0;i<30;i++){var g=document.createElement('i');g.className='gh';g.style.opacity=0;document.body.insertBefore(g,b);pool.push(g)}
 var S={x:-200,y:-200,tx:-200,ty:-200,by:0,bv:0,air:false,sq:0,sqv:0,sc:1,scv:0,pr:0,down:false,k:'',seen:false,sp:0,ang:0,st:1,t0:0,gh:[]},G=2300,REST=.56,H=68;
 addEventListener('mousemove',function(e){if(!S.seen){S.seen=true;S.x=e.clientX;S.y=e.clientY}S.tx=e.clientX;S.ty=e.clientY;var el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest?el.closest('[data-c]'):null;S.k=c?c.getAttribute('data-c'):''});
 addEventListener('mousedown',function(){S.down=true});
 addEventListener('mouseup',function(){if(!S.down)return;S.down=false;S.bv=-Math.sqrt(2*G*H);S.air=true});
 function loop(t){
  var dt=(t-(S.t0||t))/1000;S.t0=t;if(!(dt>0))dt=.016;if(dt>.033)dt=.033;
  var f=1-Math.exp(-dt*15),ox=S.x,oy=S.y+S.by;S.x+=(S.tx-S.x)*f;S.y+=(S.ty-S.y)*f;
  S.pr+=((S.down?1:0)-S.pr)*(1-Math.exp(-dt*16));
  if(S.air){S.bv+=G*dt;S.by+=S.bv*dt;if(S.by>=0){var imp=S.bv;S.by=0;if(imp>150){S.bv=-imp*REST;S.sqv+=imp*.0011}else{S.bv=0;S.air=false}}}
  S.sqv+=(-S.sq*300-S.sqv*17)*dt;S.sq+=S.sqv*dt;if(S.sq>.42)S.sq=.42;if(S.sq<-.18)S.sq=-.18;
  var hs=S.k==='view'?5.2:S.k==='link'?2.6:1,goal=S.down?hs*.68:hs;S.scv+=((goal-S.sc)*240-S.scv*24)*dt;S.sc+=S.scv*dt;
  var vx=(S.x-ox)/dt,vy=((S.y+S.by)-oy)/dt;S.sp=Math.hypot(vx,vy);if(S.sp>60)S.ang=Math.atan2(vy,vx)*180/Math.PI;
  S.st+=((1+Math.min(S.sp/2600,.7))-S.st)*(1-Math.exp(-dt*18));
  var yy=S.y+S.by+S.pr*5,air=Math.min(Math.abs(S.bv)/3400,.3),sqx=(1+S.sq)/Math.sqrt(1+air),sqy=(1-S.sq*.8)*(1+air);
  var str=Math.min(1,Math.max(0,(S.sp-90)/650));if(str>.04)S.gh.push({x:S.x,y:yy,sc:S.sc,str:str,life:1});
  for(var i=0;i<S.gh.length;i++)S.gh[i].life-=dt*1.7;S.gh=S.gh.filter(function(g){return g.life>0}).slice(-30);
  b.style.opacity=S.seen?1:0;
  b.style.transform='translate('+S.x.toFixed(2)+'px,'+yy.toFixed(2)+'px) rotate('+S.ang.toFixed(1)+'deg) scale('+S.st.toFixed(3)+','+(1/Math.sqrt(S.st)).toFixed(3)+') rotate('+(-S.ang).toFixed(1)+'deg) scale('+sqx.toFixed(3)+','+sqy.toFixed(3)+') scale('+S.sc.toFixed(3)+')';
  for(var j=0;j<30;j++){var g=S.gh[j],p=pool[j];if(g){p.style.opacity=(Math.pow(g.life,1.3)*.6*g.str).toFixed(3);p.style.transform='translate('+g.x.toFixed(2)+'px,'+g.y.toFixed(2)+'px) scale('+(g.sc*(.35+.65*g.life)).toFixed(3)+')'}else p.style.opacity=0}
  lab.style.transform='translate('+(S.x-15).toFixed(1)+'px,'+(yy-6).toFixed(1)+'px)';lab.style.opacity=(S.k==='view'&&S.sc>2.2&&!S.down)?1:0;
  requestAnimationFrame(loop);
 }
 requestAnimationFrame(loop);
})();
</script>
</body></html>
